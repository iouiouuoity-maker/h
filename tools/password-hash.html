<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Алғашқы әкімші — офлайн құрал</title><style>body{font:16px system-ui;max-width:700px;margin:50px auto;padding:20px}input,button,textarea{display:block;margin:15px 0;padding:12px;width:95%}textarea{height:180px}</style><h1>Алғашқы әкімшіні дайындау</h1><p>Осы файлды компьютерде аш. Құпиясөз желіге жіберілмейді. Нәтижедегі SQL-ді D1 Console-ге енгіз. Бұл құралды GitHub-қа жүктеу міндетті емес.</p><form id="f"><label>Әкімші коды<input id="code" value="ADMIN" pattern="[A-Za-z0-9_-]{3,40}" required></label><label>Жаңа құпиясөз (кемі 12 таңба)<input id="p" type="password" minlength="12" maxlength="128" required></label><button>Қауіпсіз хэш пен SQL жасау</button></form><label>Нәтиже<textarea id="out" readonly></textarea></label><script>
f.onsubmit=async e=>{e.preventDefault();const hex=b=>Array.from(new Uint8Array(b),x=>x.toString(16).padStart(2,'0')).join(''),enc=new TextEncoder(),salt=hex(crypto.getRandomValues(new Uint8Array(16))),key=await crypto.subtle.importKey('raw',enc.encode(p.value),'PBKDF2',false,['deriveBits']),hash=hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:100000,hash:'SHA-256'},key,256)),id=crypto.randomUUID();out.value="INSERT INTO users(id,code,role,password) VALUES('"+id+"','"+code.value.toUpperCase()+"','admin','pbkdf2$100000$"+salt+"$"+hash+"');";p.value='';};
</script></html>
